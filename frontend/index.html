<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>mormiDiskFree</title>
</head>
<body>
<header>
    <h1><img class="logo-sm" src="./src/assets/mormitech-mark.svg" alt="">mormiDiskFree</h1>
    <button id="disks" class="icon" data-tip="All disks" aria-label="All disks"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M3.4 13l2.2-6.6A2 2 0 0 1 7.5 5h9a2 2 0 0 1 1.9 1.4L20.6 13"/><path d="M7 16.5h.01M11 16.5h.01"/></svg></button>
    <button id="choose" class="icon" data-tip="Choose a folder to scan…" aria-label="Choose a folder to scan…"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10.5v5M9.5 13h5"/></svg></button>
    <button id="rescan" class="icon" data-tip="Scan everything again" aria-label="Scan everything again" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.6L4 8.5M4 4v4.5h4.5M4 13a8 8 0 0 0 14.3 4.6L20 15.5M20 20v-4.5h-4.5"/></svg></button>
    <button id="rescanfolder" class="icon" data-tip="Scan only the folder shown, and keep the rest" aria-label="Scan only the folder shown, and keep the rest" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V10"/><path d="M3 12v5a2 2 0 0 0 2 2h5"/><path d="M21 14.5a4.5 4.5 0 0 0-8-1.6M13 10.5v2.5h2.5M13 17.5a4.5 4.5 0 0 0 8 1.6M21 22v-2.5h-2.5" transform="translate(0 0)"/></svg></button>
    <button id="up" class="icon" data-tip="One folder up" aria-label="One folder up" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>
    <button id="root" class="icon" data-tip="Back to the top of the scanned disk or folder" aria-label="Back to the top of the scanned disk or folder" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7M6 9.5V20h12V9.5M10 20v-5.5h4V20"/></svg></button>
    <div id="cache" hidden></div>
    <div id="space" hidden></div>
</header>
<main>
    <section id="chart">
        <nav id="crumbs"></nav>
        <div id="stage"><svg id="sun"></svg><div id="center"></div></div>
    </section>
    <aside>
        <div id="list"></div>
        <div id="basket" hidden></div>
    </aside>
    <div id="splash"></div>
</main>
<div id="about" hidden></div>
<div id="tip" hidden></div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
